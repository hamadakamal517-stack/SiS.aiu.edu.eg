<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>AIU Login</title>

  <div class="box">

    <select><option>العربية</option></select>
    <button onclick="login()">تسجيل الدخول</button>
  </div>
</div>
<script>
function login(){
  if(username.value==="23100325" && password.value==="Hamada@#2005"){

</script>
</body>
</html>
