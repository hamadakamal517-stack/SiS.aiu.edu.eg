<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIU Login</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f3f3f5;
height:100vh;
overflow:hidden;
}

.page{
height:100vh;
max-width:450px;
margin:auto;
padding:10px 20px;
display:flex;
flex-direction:column;
justify-content:center;
}

.logo{
width:100%;
max-height:230px;
object-fit:contain;
display:block;
margin:0 auto 15px;
}

label{
display:block;
width:85%;
margin:8px auto 4px;
font-size:15px;
color:#444;
}

input,select{
width:85%;
height:42px;
display:block;
margin:auto;
padding:8px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
background:white;
}

button{
width:85%;
height:45px;
display:block;
margin:12px auto 0;
background:#2f73d2;
color:white;
border:none;
border-radius:6px;
font-size:17px;
}

</style>
</head>

<body>

<div class="page">

<img src="logo.png" class="logo">

<label>معرف مستخدم</label>
<input id="username" value="23100325">

<label>كلمة المرور</label>
<input id="password" type="password">

<label>حدد إحدى اللغات</label>

<select>
<option>العربية</option>
<option>English</option>
</select>

<button onclick="login()">
تسجيل الدخول
</button>

</div>

<script>

function login(){

if(
username.value==="23100325" &&
password.value==="Hamada@#2005"
){
window.location.href="dashboard.html";
}
else{
alert("بيانات الدخول غير صحيحة");
}

}

</script>

</body>
</html>
