<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AIU Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#f5f7fa}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.logo{
width:100%;
max-width:420px;
margin-bottom:20px;
display:block;
.box{
width:100%;
max-width:340px;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1)
}
label{display:block;margin-top:10px}
input,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
height:45px;
}
button{width:100%;margin-top:15px;padding:14px;background:#2a6ecb;color:#fff;border:none;border-radius:6px;font-size:16px}

</head>
<body>
<div class="page">
<img src="logo.png" class="logo">
  <div class="box">
    <label>معرف مستخدم</label>
    <input id="username" value="23100325">

    <label>حدد إحدى اللغات</label>
    <select>
<option>العربية</option>
<option>English</option>
    </select>
    <button onclick="login()">تسجيل الدخول</button>
  </div>
</div>
<script>
function login(){
  if(username.value==="23100325" && password.value==="Hamada@#2005"){
    window.location.href="dashboard.html";
  }else{
    alert("بيانات الدخول غير صحيحة");
  }
}
</script>
</body>
</html>
