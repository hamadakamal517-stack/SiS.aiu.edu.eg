<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الحساب المالي</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f2f2f2;
    }

    /* Header */
    .header {
      background-color: #1f3b4d;
      color: #fff;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
    }

    .header-icon {
      font-size: 22px;
      cursor: pointer;
    }

    /* Content */
    .content {
      background-color: #fff;
      margin-top: 10px;
    }

    .row {
      padding: 18px;
      border-bottom: 1px solid #ddd;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row:hover {
      background-color: #f7f7f7;
    }

    .center-message {
      padding: 50px 20px;
      text-align: center;
      font-size: 18px;
      color: #333;
    }

    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-icon">⋮</span>
    <div class="header-title">الحساب المالي</div>
    <a href="dashboard.html" class="header-icon">‹</a>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="center-message">
      ليس عليك أي مصروفات مستحقة في الوقت الحالي
    </div>
  </div>

</body>
</html>
